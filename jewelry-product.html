<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piercing &amp; Sign | Bijou</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .product-page { min-height:80vh; padding:100px 0 80px; background:#f5f5f5; }

    .product-layout {
      display:grid; grid-template-columns:1fr 1fr; gap:0;
      max-width:1060px; margin:0 auto;
      background:#fff; border:1px solid #e0e0e0;
      overflow:hidden; border-radius:4px;
      box-shadow:0 2px 20px rgba(0,0,0,.08);
    }

    /* ── Image column ── */
    .product-img-col { display:flex; flex-direction:column; }
    .product-img-wrap {
      position:relative; overflow:hidden;
      background:#fff; aspect-ratio:1/1; flex:1;
    }
    .product-img-wrap img { width:100%; height:100%; object-fit:contain; display:block; transition:opacity .3s; padding:16px; box-sizing:border-box; }

    .product-img-thumbs {
      display:flex; gap:8px; padding:12px;
      background:#f5f5f5; border-top:1px solid #ddd;
    }
    .product-img-thumbs img {
      width:60px; height:60px; object-fit:contain;
      background:#fff; border:2px solid transparent;
      cursor:pointer; border-radius:2px; padding:4px;
      transition:border-color .15s;
    }
    .product-img-thumbs img.active,
    .product-img-thumbs img:hover { border-color:#888; }

    /* ── Logo badge ── */
    .product-logo {
      display:flex; align-items:center; justify-content:center;
      margin-bottom:18px;
    }
    .product-logo-inner {
      width:72px; height:72px; border-radius:50%;
      background:#fff; border:2px solid #ddd;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
    }
    .product-logo-inner .logo-main {
      font-family:'Oswald',sans-serif; font-size:7px;
      letter-spacing:1.5px; text-transform:uppercase;
      color:#1a1a2e; text-align:center; line-height:1.2;
    }
    .product-logo-inner .logo-sub {
      font-size:5.5px; letter-spacing:.8px; text-transform:uppercase;
      color:#777; text-align:center; line-height:1.3; margin-top:2px;
    }

    /* ── Trust badges ── */
    .product-trust {
      display:flex; justify-content:space-between; gap:8px;
      margin-top:20px; padding-top:20px;
      border-top:1px solid #eee;
    }
    .trust-item {
      flex:1; display:flex; flex-direction:column;
      align-items:center; text-align:center; gap:6px;
    }
    .trust-item svg { width:26px; height:26px; stroke:#aaa; fill:none; stroke-width:1.4; flex-shrink:0; }
    .trust-item span { font-size:9px; letter-spacing:.8px; text-transform:uppercase; color:#aaa; line-height:1.45; }

    /* ── Info column ── */
    .product-info { padding:32px 40px 32px; display:flex; flex-direction:column; background:#fff; }

    .product-back {
      display:inline-flex; align-items:center; gap:6px;
      font-size:0.68em; letter-spacing:2px; text-transform:uppercase;
      color:#bbb; margin-bottom:20px; transition:color .2s;
    }
    .product-back:hover { color:#555; }

    .product-name {
      font-family:'Oswald',sans-serif; font-size:1.85em;
      letter-spacing:2px; color:#1a1a2e; line-height:1.15;
      text-transform:uppercase; margin-bottom:8px;
    }
    .product-desc {
      font-size:0.72em; color:#888; letter-spacing:.4px;
      line-height:1.75; margin-bottom:18px;
    }

    .product-price-row { display:flex; align-items:baseline; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
    .product-price {
      font-family:'Oswald',sans-serif; font-size:2.4em;
      color:#1a1a2e; letter-spacing:1px;
    }
    .product-price-ht { font-size:0.78em; color:#aaa; letter-spacing:.3px; }

    .product-divider { height:1px; background:#eee; margin:0 0 22px; }

    /* ── Section ── */
    .product-section { margin-bottom:22px; }
    .section-lbl {
      font-size:0.6em; letter-spacing:2.5px; text-transform:uppercase;
      color:#aaa; font-weight:600; margin-bottom:10px; display:block;
    }

    /* ── Radio options ── */
    .radio-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .radio-opt {
      display:flex; align-items:center; gap:9px;
      padding:9px 12px; border:1px solid #e0e0e0; border-radius:4px;
      cursor:pointer; transition:border-color .15s; background:#fff;
    }
    .radio-opt:hover { border-color:#aaa; }
    .radio-opt input { position:absolute; opacity:0; width:0; height:0; }
    .radio-opt:has(input:checked) { border-color:#1a1a2e; background:#f8f8f8; }

    .radio-circle {
      width:16px; height:16px; border-radius:50%;
      border:2px solid #ccc; flex-shrink:0; position:relative;
      transition:border-color .15s;
    }
    .radio-opt:has(input:checked) .radio-circle { border-color:#1a1a2e; }
    .radio-opt:has(input:checked) .radio-circle::after {
      content:''; position:absolute; inset:3px;
      background:#1a1a2e; border-radius:50%;
    }
    .radio-lbl { font-size:12px; color:#666; line-height:1.3; }
    .radio-opt:has(input:checked) .radio-lbl { color:#1a1a2e; font-weight:600; }

    /* ── Color radio ── */
    .color-circle {
      width:18px; height:18px; border-radius:50%; flex-shrink:0;
      border:1px solid #ddd;
    }
    .color-circle.grey { background:linear-gradient(135deg,#d8d8d8,#909090); }
    .color-circle.gold { background:linear-gradient(135deg,#f0cc6a,#c9a135); }

    /* ── Stock + Qty ── */
    .stock-qty-row { display:flex; align-items:flex-start; gap:24px; margin-bottom:20px; flex-wrap:wrap; }
    .stock-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(34,197,94,.08); color:#16a34a;
      border:1px solid rgba(34,197,94,.35); border-radius:4px;
      padding:6px 12px; font-size:11px; letter-spacing:1.5px;
      text-transform:uppercase; font-weight:600; flex-shrink:0;
      margin-top:18px;
    }
    .stock-badge svg { width:12px; height:12px; stroke:#16a34a; fill:none; stroke-width:2.5; }

    .qty-section { display:flex; flex-direction:column; gap:6px; }
    .qty-label {
      font-size:0.6em; letter-spacing:2.5px; text-transform:uppercase;
      color:#aaa; font-weight:600;
    }
    .qty-wrap { display:flex; align-items:center; border:1px solid #e0e0e0; border-radius:4px; overflow:hidden; }
    .qty-btn {
      width:36px; height:36px; background:#f5f5f5; border:none;
      color:#333; font-size:18px; line-height:1; cursor:pointer;
      transition:background .15s; display:flex; align-items:center; justify-content:center;
    }
    .qty-btn:hover { background:#eee; }
    .qty-val {
      min-width:46px; text-align:center; font-size:14px; color:#333;
      height:36px; display:flex; align-items:center; justify-content:center;
      border-left:1px solid #e0e0e0; border-right:1px solid #e0e0e0;
    }

    /* ── Add to cart ── */
    .add-btn { width:100%; margin-top:auto; padding-top:20px; }
    .add-btn button {
      width:100%; background:#1a1a2e; color:#fff; border:none;
      font-family:'Oswald',sans-serif; font-size:0.88em; letter-spacing:3px;
      text-transform:uppercase; padding:16px 24px; cursor:pointer;
      transition:background .2s; display:flex; align-items:center;
      justify-content:center; gap:10px; border-radius:2px;
    }
    .add-btn button:hover { background:#2d2d50; }
    .add-btn button svg { width:18px; height:18px; stroke:#fff; fill:none; stroke-width:1.8; flex-shrink:0; }

    /* ── Nav prev/next ── */
    .product-nav-btns { display:flex; gap:10px; margin-top:16px; }
    .product-nav-btns a {
      flex:1; text-align:center; padding:10px 14px;
      font-size:0.68em; letter-spacing:2px; text-transform:uppercase;
      border:1px solid #e0e0e0; color:#aaa; transition:all .2s;
    }
    .product-nav-btns a:hover { border-color:#aaa; color:#333; }

    .product-not-found { text-align:center; padding:120px 24px; color:#888; }
    .product-not-found h2 { font-family:'Oswald',sans-serif; font-size:2em; margin-bottom:16px; color:#1a1a2e; }

    @media(max-width:768px) {
      .product-layout { grid-template-columns:1fr; margin:0 16px; }
      .product-img-wrap { aspect-ratio:4/3; }
      .product-info { padding:28px 24px 32px; }
      .product-name { font-size:1.5em; }
      .product-page { padding:80px 0 60px; }
      .product-trust { gap:4px; }
      .trust-item span { font-size:8px; }
    }
    @media(max-width:480px) {
      .product-info { padding:22px 18px 28px; }
      .radio-grid { grid-template-columns:1fr; }
      .product-trust { flex-wrap:wrap; }
      .trust-item { flex:0 0 calc(50% - 8px); }
    }
  </style>
</head>

const CAT_GAUGE = {clicker:'16G (1,2 mm)',labret:'14G (1,2 mm)',top:'14G (1,2 mm)',industriel:'14G (1,6 mm)',nombril:'14G (1,6 mm)'};

let _id = 0;
const PRODUCTS = [];
for (const g of GROUPS) {
  const range = g.p1 - g.p0;
  for (const num of g.nums) {
    _id++;
    const price = g.p0 + Math.round(((_id % 9) / 8) * range);
    PRODUCTS.push({
      id: _id,
      cat: g.cat,
      img: `pictures/jewlery%20pictures/DSC_${String(num).padStart(4,'0')}.jpg`,
      img2: `pictures/jewlery%20pictures/DSC_${String(num).padStart(4,'0')}-2.jpg`,
      price,
      name: `${CAT_LABEL[g.cat]} ${String(_id).padStart(3,'0')}`,
      sizes: g.sizes
    });
  }
}

/* ── Admin overrides ─────────────────────────────────────── */
(function applyAdminOverrides() {
  try {
    const ov   = JSON.parse(localStorage.getItem('ps_overrides')   || '{}');
    const newP = JSON.parse(localStorage.getItem('ps_newProducts') || '[]');
    const disc = JSON.parse(localStorage.getItem('ps_discount')    || 'null');
    for (let i = PRODUCTS.length - 1; i >= 0; i--) {
      const o = ov[PRODUCTS[i].id];
      if (!o) continue;
      if (o.hidden) { PRODUCTS.splice(i, 1); continue; }
      if (o.name)  PRODUCTS[i].name  = o.name;
      if (o.price !== undefined) PRODUCTS[i].price = o.price;
      if (o.img)   PRODUCTS[i].img   = o.img;
      if (o.img2)  PRODUCTS[i].img2  = o.img2;
      if (o.sizes) PRODUCTS[i].sizes = o.sizes;
    }
    newP.filter(p => !p.hidden).forEach(p => PRODUCTS.push(p));
    if (disc && disc.active && disc.percentage > 0) {
      PRODUCTS.forEach(p => {
        p.originalPrice = p.price;
        p.price = Math.round(p.price * (1 - disc.percentage / 100));
        p.discLabel = disc.label || ('-' + disc.percentage + '%');
      });
    }
  } catch(e) {}
})();

let product = null;

/* ── Load product from URL ───────────────────────────────── */

  const id = parseInt(new URLSearchParams(location.search).get('id'));
  product = PRODUCTS.find(p => p.id === id);
  document.title = product ? `Piercing & Sign | ${product.name}` : 'Piercing & Sign';

  const container = document.getElementById('productContainer');

      <div class="product-not-found">
        <h2>Produit introuvable</h2>
        <p>Ce bijou n'existe pas ou a été retiré.</p>
        <a href="jewelry.html" class="btn btn--red" style="margin-top:24px;display:inline-block;">← Retour aux bijoux</a>
      </div>`;
    return;
  }

  const prevId = PRODUCTS[idx > 0 ? idx - 1 : PRODUCTS.length - 1].id;

    '<span class="qty-val" id="qtyDisplay">1</span>' +
    '<button class="qty-btn" id="qtyPlus">+</button>' +
    '</div>' +
    '</div>' +
    '</div>' +
    '<div class="add-btn">' +
    '<button id="addBtn">' +
    '<svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>' +
    'Ajouter au panier' +
    '</button>' +
    '</div>' +
    '<div class="product-trust">' +
    '<div class="trust-item">' +
    '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' +
    '<span>Titane<br>ASTM F136</span>' +
    '</div>' +
    '<div class="trust-item">' +
    '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' +
    '<span>Hypo&shy;allergénique</span>' +
    '</div>' +
    '<div class="trust-item">' +
    '<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>' +
    '<span>Expédition<br>rapide</span>' +
    '</div>' +
    '</div>' +
    '<div class="product-nav-btns">' +
    '<a href="jewelry-product.html?id=' + prevId + '">← Précédent</a>' +
    '<a href="jewelry-product.html?id=' + nextId + '">Suivant →</a>' +
    '</div>' +
    '</div>' +
    '</div>';

  function setMainImg(src) {
    document.getElementById('productImg').src = src;
    document.querySelectorAll('.product-img-thumbs img').forEach(t => {
      t.classList.toggle('active', t.dataset.src === src);
    });
  }

  /* thumbnail clicks */
  document.querySelectorAll('.product-img-thumbs img').forEach(t => {
    t.addEventListener('click', () => setMainImg(t.dataset.src));
  });

  /* color image switching */
  document.getElementById('colorArgent').addEventListener('change', () => {
    const test = new Image();
    test.onload  = () => setMainImg(product.img2);
    test.onerror = () => setMainImg(product.img);
    test.src = product.img2;
  });
  document.getElementById('colorDore').addEventListener('change', () => setMainImg(product.img));

  /* qty */
  let qty = 1;
  document.getElementById('qtyMinus').addEventListener('click', () => {
    if (qty > 1) { qty--; document.getElementById('qtyDisplay').textContent = qty; }
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    qty++; document.getElementById('qtyDisplay').textContent = qty;
  });

  /* add to cart */
  document.getElementById('addBtn').addEventListener('click', () => {
    const sizeEl  = document.querySelector('input[name="size"]:checked');
    const colorEl = document.querySelector('input[name="color"]:checked');
    if (!sizeEl) { showToast('Veuillez choisir une taille.'); return; }
    const selSize  = sizeEl.value;
    const selColor = colorEl ? colorEl.value : 'Doré';
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const key  = `j${product.id}-${selSize}-${selColor}`;
    const ex   = cart.find(c => c.key === key);
    if (ex) ex.qty += qty;
    else cart.push({ key, id: product.id, name: product.name, price: product.price, size: selSize, color: selColor, img: product.img, qty });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartUI();
    showToast(`✓ ${product.name} · ${selSize} · ${selColor}${qty > 1 ? ' × ' + qty : ''}`);
  });

  updateCartUI();
}

function updateCartUI() {
  const n = JSON.parse(localStorage.getItem('cart') || '[]').reduce((s, c) => s + c.qty, 0);
  ['cartCount','cartBadge'].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = n > 0 ? n : ''; });
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('toast--out'); setTimeout(() => t.remove(), 400); }, 2800);
}

document.addEventListener('DOMContentLoaded', () => {
  init();
  window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', scrollY > 40), { passive: true });
});
</script>
<script src="nav.js"></script>
</body>
