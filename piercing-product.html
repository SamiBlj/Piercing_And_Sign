<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piercing &amp; Sign | Détail Piercing</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .product-page { min-height:80vh; padding:100px 0 80px; background:var(--bg); }

    .product-layout {
      display:grid; grid-template-columns:1fr 1fr; gap:0;
      max-width:1060px; margin:0 auto;
      background:var(--bg-2); border:1px solid var(--border);
    }

    /* ── Image column ── */
    .product-img-wrap {
      position:relative; overflow:hidden;
      background:var(--bg-3); aspect-ratio:1/1;
    }
    .product-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }

    /* ── Info column ── */
    .product-info { padding:40px 44px 40px; display:flex; flex-direction:column; }

    .product-back {
      display:inline-flex; align-items:center; gap:6px;
      font-size:0.68em; letter-spacing:2px; text-transform:uppercase;
      color:var(--t2); margin-bottom:24px; transition:color .2s;
    }
    .product-back:hover { color:var(--t1); }

    .product-name {
      font-family:'Oswald',sans-serif; font-size:1.85em;
      letter-spacing:2px; color:var(--t1); line-height:1.15;
      text-transform:uppercase; margin-bottom:10px;
    }
    .product-desc {
      font-size:0.72em; color:var(--t2); letter-spacing:.4px;
      line-height:1.75; margin-bottom:18px;
    }

    .product-price-row { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
    .product-price {
      font-family:'Oswald',sans-serif; font-size:2.4em;
      color:var(--gold); letter-spacing:1px;
    }
    .product-price-ht {
      font-size:0.78em; color:var(--t3); letter-spacing:.3px;
    }
    .product-ref {
      font-size:0.62em; letter-spacing:2px; text-transform:uppercase;
      color:var(--t3); margin-bottom:22px;
    }

    .product-divider { height:1px; background:var(--border); margin:0 0 22px; }

    /* ── Section ── */
    .product-section { margin-bottom:22px; }
    .section-lbl {
      font-size:0.6em; letter-spacing:2.5px; text-transform:uppercase;
      color:var(--t3); font-weight:600; margin-bottom:10px; display:block;
    }

    /* ── Radio options ── */
    .radio-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .radio-opt {
      display:flex; align-items:center; gap:9px;
      padding:9px 12px; border:1px solid var(--border); border-radius:4px;
      cursor:pointer; transition:border-color .15s;
    }
    .radio-opt:hover { border-color:var(--t3); }
    .radio-opt input { position:absolute; opacity:0; width:0; height:0; }
    .radio-opt:has(input:checked) { border-color:var(--t1); }

    .radio-circle {
      width:16px; height:16px; border-radius:50%;
      border:2px solid var(--t3); flex-shrink:0; position:relative;
      transition:border-color .15s;
    }
    .radio-opt:has(input:checked) .radio-circle { border-color:var(--t1); }
    .radio-opt:has(input:checked) .radio-circle::after {
      content:''; position:absolute; inset:3px;
      background:var(--t1); border-radius:50%;
    }
    .radio-lbl { font-size:12px; color:var(--t2); line-height:1.3; }
    .radio-opt:has(input:checked) .radio-lbl { color:var(--t1); }

    /* ── Color radio ── */
    .color-circle {
      width:18px; height:18px; border-radius:50%; flex-shrink:0;
      border:1px solid rgba(255,255,255,.15);
    }
    .color-circle.grey { background:linear-gradient(135deg,#d8d8d8,#909090); }
    .color-circle.gold { background:linear-gradient(135deg,#f0cc6a,#c9a135); }

    /* ── Filetage badge on image ── */
    .filetage-badge {
      position:absolute; top:14px; right:14px;
      width:68px; height:68px; border-radius:50%;
      background:rgba(12,12,12,.88);
      border:1px solid var(--border2);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; gap:3px;
      backdrop-filter:blur(4px);
    }
    .filetage-badge svg { width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:1.4; }
    .filetage-badge span {
      font-size:7px; letter-spacing:.8px; text-transform:uppercase;
      color:var(--t2); line-height:1.35;
    }

    /* ── Stock + Qty ── */
    .stock-qty-row { display:flex; align-items:flex-start; gap:24px; margin-bottom:20px; flex-wrap:wrap; }
    .stock-badge {
      display:inline-flex; align-items:center; gap:6px;
      background:rgba(34,197,94,.12); color:#22c55e;
      border:1px solid rgba(34,197,94,.3); border-radius:4px;
      padding:6px 12px; font-size:11px; letter-spacing:1.5px;
      text-transform:uppercase; font-weight:600; flex-shrink:0;
      margin-top:18px;
    }
    .stock-badge svg { width:12px; height:12px; stroke:#22c55e; fill:none; stroke-width:2.5; }

    .qty-section { display:flex; flex-direction:column; gap:6px; }
    .qty-label {
      font-size:0.6em; letter-spacing:2.5px; text-transform:uppercase;
      color:var(--t3); font-weight:600;
    }
    .qty-wrap { display:flex; align-items:center; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
    .qty-btn {
      width:36px; height:36px; background:var(--bg-3); border:none;
      color:var(--t1); font-size:18px; line-height:1; cursor:pointer;
      transition:background .15s; display:flex; align-items:center; justify-content:center;
    }
    .qty-btn:hover { background:var(--bg-4,#333); }
    .qty-val {
      min-width:46px; text-align:center; font-size:14px;
      height:36px; display:flex; align-items:center; justify-content:center;
      border-left:1px solid var(--border); border-right:1px solid var(--border);
    }

    /* ── Add to cart ── */
    .add-btn {
      width:100%; margin-top:auto; padding-top:20px;
    }
    .add-btn button {
      width:100%; background:#1a1a2e; color:#fff; border:1px solid rgba(255,255,255,.12);
      font-family:'Oswald',sans-serif; font-size:0.88em; letter-spacing:3px;
      text-transform:uppercase; padding:15px 24px; cursor:pointer;
      transition:background .2s; display:flex; align-items:center;
      justify-content:center; gap:10px; border-radius:2px;
    }
    .add-btn button:hover { background:#22223a; }
    .add-btn button svg { width:18px; height:18px; stroke:#fff; fill:none; stroke-width:1.8; flex-shrink:0; }

    /* ── Nav prev/next ── */
    .product-nav-btns { display:flex; gap:10px; margin-top:16px; }
    .product-nav-btns a {
      flex:1; text-align:center; padding:10px 14px;
      font-size:0.68em; letter-spacing:2px; text-transform:uppercase;
      border:1px solid var(--border); color:var(--t2); transition:all .2s;
    }
    .product-nav-btns a:hover { border-color:var(--t3); color:var(--t1); }

    .product-not-found { text-align:center; padding:120px 24px; color:var(--t2); }
    .product-not-found h2 { font-family:'Oswald',sans-serif; font-size:2em; margin-bottom:16px; color:var(--t1); }

    @media(max-width:768px) {
      .product-layout { grid-template-columns:1fr; margin:0 16px; }
      .product-img-wrap { aspect-ratio:4/3; }
      .product-info { padding:28px 24px 32px; }
      .product-name { font-size:1.5em; }
      .product-page { padding:80px 0 60px; }
    }
    @media(max-width:480px) {
      .product-info { padding:22px 18px 28px; }
      .radio-grid { grid-template-columns:1fr; }
    }
  </style>
</head>

<script>
/* ── All 46 piercing products ─────────────────────────── */
const BASE = 'pictures/piercing%20pictures/';
const TYPES = [
  'Piercing Hélix','Piercing Lobe','Piercing Tragus','Piercing Daith',
  'Piercing Nez','Piercing Septum','Piercing Nombril','Piercing Labret',
  'Piercing Rook','Piercing Conch','Piercing Industriel','Piercing Arcade'
];
const PRICES = [35,38,40,42,45,35,38,42,40,45,38,35,42,40,38,45,35,40,42,38,45,35,38,40,42,45,38,40,35,42,45,38,40,42,35,45,38,42,40,35,45,38,40,42,35,38];

const PHOTOS = [
  'WhatsApp%20Image%202026-06-20%20at%2008.05.04%20%281%29.jpeg',

  'WhatsApp%20Image%202026-06-20%20at%2008.05.09%20%282%29.jpeg',

  'WhatsApp%20Image%202026-06-20%20at%2008.05.11%20%282%29.jpeg',

  'WhatsApp%20Image%202026-06-20%20at%2008.05.12%20%281%29.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.12%20%282%29.jpeg',

  'WhatsApp%20Image%202026-06-20%20at%2008.05.12%20%285%29.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.12%20%286%29.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.12%20%287%29.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.12.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.13%20%281%29.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.13%20%282%29.jpeg',
  'WhatsApp%20Image%202026-06-20%20at%2008.05.13.jpeg'
];

const PRODUCTS = PHOTOS.map((photo, i) => ({
  id: i + 1,
  img: BASE + photo,
  name: TYPES[i % TYPES.length],
  price: PRICES[i],
  sizes: ['6mm','8mm','10mm','12mm']
}));

let product = null;

/* ── Load product from URL ────────────── */
function init() {
  const id = parseInt(new URLSearchParams(location.search).get('id'));
  product = PRODUCTS.find(p => p.id === id);
  document.title = product ? `Piercing & Sign | ${product.name}` : 'Piercing & Sign';

  const container = document.getElementById('productContainer');

  if (!product) {
    container.innerHTML = `
      <div class="product-not-found">
        <h2>Produit introuvable</h2>
        <p>Ce piercing n'existe pas ou a été retiré.</p>
        <a href="piercings.html" class="btn btn--red" style="margin-top:24px;display:inline-block;">← Retour aux piercings</a>
      </div>`;
    return;
  }

  const prevId = product.id > 1 ? product.id - 1 : PRODUCTS.length;
  const nextId = product.id < PRODUCTS.length ? product.id + 1 : 1;

  const ref = `PS-P${String(product.id).padStart(3,'0')}`;
  const sizesHTML = product.sizes.map(s => `
    <label class="radio-opt">
      <input type="radio" name="size" value="${s}">
      <span class="radio-circle"></span>
      <span class="radio-lbl">16G (1,2 mm) — ${s}</span>
    </label>`).join('');

  container.innerHTML = `
    <div class="product-layout">
      <div class="product-img-wrap">
        <img src="${product.img}" alt="${product.name}" id="productImg">
        <div class="filetage-badge">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <span>Titane<br>ASTM F136</span>
        </div>
      </div>
      <div class="product-info">
        <a href="piercings.html" class="product-back">← Retour aux piercings</a>

        <h1 class="product-name">${product.name}</h1>
        <p class="product-desc">Bijou de piercing en titane ASTM F136<br>Hypoallergénique · Qualité implant médical · Réalisé en boutique</p>

        <div class="product-price-row">
          <span class="product-price">${product.price}&nbsp;€</span>
          <span class="product-price-ht">(= ${(product.price / 1.2).toFixed(2).replace('.',',')} € HT)</span>
        </div>
        <div class="product-ref">RÉFÉRENCE : ${ref}</div>

        <div class="product-divider"></div>

        <div class="product-section">
          <span class="section-lbl">Taille</span>
          <div class="radio-grid">${sizesHTML}</div>
        </div>

        <div class="product-section">
          <span class="section-lbl">Couleur</span>
          <div class="radio-grid">
            <label class="radio-opt">
              <input type="radio" name="color" value="Argent">
              <span class="radio-circle"></span>
              <span class="color-circle grey"></span>
              <span class="radio-lbl">Titane gris</span>
            </label>
            <label class="radio-opt">
              <input type="radio" name="color" value="Doré" checked>
              <span class="radio-circle"></span>
              <span class="color-circle gold"></span>
              <span class="radio-lbl">Titane doré</span>
            </label>
          </div>
        </div>

        <div class="stock-qty-row">
          <div class="stock-badge">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            En stock
          </div>
          <div class="qty-section">
            <span class="qty-label">Quantité</span>
            <div class="qty-wrap">
              <button class="qty-btn" id="qtyMinus">−</button>
              <span class="qty-val" id="qtyDisplay">1</span>
              <button class="qty-btn" id="qtyPlus">+</button>
            </div>
          </div>
        </div>

        <div class="add-btn">
          <button id="addBtn">
            <svg viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Ajouter au panier
          </button>
        </div>

        <div class="product-nav-btns">
          <a href="piercing-product.html?id=${prevId}">← Précédent</a>
          <a href="piercing-product.html?id=${nextId}">Suivant →</a>
        </div>
      </div>
    </div>`;

  /* qty */
  let qty = 1;
  document.getElementById('qtyMinus').addEventListener('click', () => {
    if (qty > 1) { qty--; document.getElementById('qtyDisplay').textContent = qty; }
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    qty++; document.getElementById('qtyDisplay').textContent = qty;
  });

  /* add to cart */
  document.getElementById('addBtn').addEventListener('click', addToCart);

  updateCartUI();

  function addToCart() {
    const sizeEl  = document.querySelector('input[name="size"]:checked');
    const colorEl = document.querySelector('input[name="color"]:checked');
    if (!sizeEl) { showToast('Veuillez choisir une taille.'); return; }
    const selSize  = sizeEl.value;
    const selColor = colorEl ? colorEl.value : 'Doré';
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const key  = `p${product.id}-${selSize}-${selColor}`;
    const ex   = cart.find(c => c.key === key);
    if (ex) ex.qty += qty;
    else cart.push({ key, id: product.id, name: product.name, price: product.price, size: selSize, color: selColor, img: product.img, qty });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartUI();
    showToast(`✓ ${product.name} · ${selSize} · ${selColor}${qty > 1 ? ' × ' + qty : ''}`);
  }
}

function updateCartUI() {
  const n = JSON.parse(localStorage.getItem('cart') || '[]').reduce((s, c) => s + c.qty, 0);
  ['cartCount','cartBadge'].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = n > 0 ? n : ''; });
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('toast--out'); setTimeout(() => t.remove(), 400); }, 2800);
}

/* ── Nav ──────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  init();
  /* nav behaviour handled by nav.js */
  window.addEventListener('scroll', () => document.getElementById('nav').classList.toggle('scrolled', scrollY > 40), { passive: true });
});
</script>
<script src="nav.js"></script>
